# Local development: a single standalone Redis.
#   docker run -d --name wannasong-redis -p 6379:6379 redis:7-alpine
# No local Redis? Use the dev profile instead (SPRING_PROFILES_ACTIVE=dev).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

wannasong.allowed-origins=http://localhost:3000
logging.level.io.anick.wannassong=DEBUG
