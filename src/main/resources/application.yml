server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /   # TODO: 나중에 실제 context-path 입력

spring:
  application:
    name: wannassong

# socket.io-client v4 가 붙는 포트 (Node 원본과 동일한 3000)
socketio:
  hostname: 0.0.0.0
  port: ${SOCKETIO_PORT:3000}
  allowed-origin: ${ALLOWED_ORIGIN:*}   # TODO: Vercel 도메인으로 좁힐 것

wannasong:
  data-dir: ${DATA_DIR:./data}
  cooldown-sec: ${COOLDOWN_SEC:300}
  max-queue: ${MAX_QUEUE:50}
  max-pending-per-user: ${MAX_PENDING_PER_USER:3}
  access-code: ${ACCESS_CODE:}
  speaker-key: ${SPEAKER_KEY:}
  yt-api-key: ${YT_API_KEY:}
  fallback-playlist: ${FALLBACK_PLAYLIST:}
  public-url: ${PUBLIC_URL:}
  version: 0.0.1

logging:
  level:
    io.anick.wannassong: INFO
