# ---- Common ----
# NOTE: .properties files are read as ISO-8859-1 (java.util.Properties spec),
# so keep this file ASCII-only. Non-ASCII values belong in fallback.txt (UTF-8)
# or must be \uXXXX escaped.

# Profiles: dev (default) | local
#   dev   - the development server Redis cluster. Nothing to install.
#   local - a standalone Redis on localhost:6379, for working offline.
#           opt in with --spring.profiles.active=local or SPRING_PROFILES_ACTIVE=local
spring.profiles.default=dev
spring.application.name=wannassong
spring.data.redis.repositories.enabled=false

# REST (/api/*). CONTEXT_PATH=/jukebox serves /jukebox/api/* instead (default: root).
server.port=${PORT:3001}
server.servlet.context-path=${CONTEXT_PATH:}

# socket.io. netty-socketio cannot share the Tomcat port, so it is a second listener.
# When CONTEXT_PATH is set, set SOCKETIO_CONTEXT to match the client path.
socketio.hostname=0.0.0.0
socketio.port=${SOCKETIO_PORT:3002}
socketio.context=${SOCKETIO_CONTEXT:/socket.io}

# Only fallback.txt is read from here; all other state lives in Redis.
wannasong.data-dir=${DATA_DIR:./data}
wannasong.cooldown-sec=${COOLDOWN_SEC:300}
wannasong.max-queue=${MAX_QUEUE:50}
wannasong.max-pending-per-user=${MAX_PENDING_PER_USER:3}
wannasong.access-code=${ACCESS_CODE:}
wannasong.speaker-key=${SPEAKER_KEY:}
wannasong.yt-api-key=${YT_API_KEY:}
wannasong.fallback-playlist=${FALLBACK_PLAYLIST:}
wannasong.public-url=${PUBLIC_URL:}
# Public port reported by /api/info (lanUrls, port). Blank falls back to server.port.
# Behind a proxy, set the port the browser actually reaches (80/443, or 3000 locally).
wannasong.public-port=${PUBLIC_PORT:}
wannasong.allowed-origins=${ALLOWED_ORIGINS:*}
wannasong.version=0.0.1

logging.level.io.anick.wannassong=INFO
